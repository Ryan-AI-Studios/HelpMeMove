# cargo-deny 0.20.2. Unpublished workspace crates are ignored so this
# repository does not declare a product license.

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Track 0030 pins reqwest 0.13.5 with feature rustls. That feature
    # builds aws-lc (ISC, and MIT-0 inside aws-lc-sys) and the CA bundle
    # webpki-root-certs (CDLA-Permissive-2.0).
    "ISC",
    "MIT-0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
