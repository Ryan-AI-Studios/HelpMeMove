[package]
name = "helpmemove_safety"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
helpmemove_domain = { path = "../domain", version = "0.1.0" }
helpmemove_content = { path = "../content", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
